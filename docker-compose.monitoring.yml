# Monitoring stack — run alongside docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Credentials: Grafana reads GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD from
# the environment (or a .env file beside this one). Both are REQUIRED — the
# hardcoded admin/admin default was removed, and `${VAR:?message}` makes
# `docker compose up` refuse to start with a clear message rather than quietly
# bringing up an instance anyone can log into. For local use:
#
#   echo "GRAFANA_ADMIN_USER=admin"                     >> .env
#   echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> .env
#
# .env is gitignored. Nothing here echoes the value.
#
# Includes:
#   • Prometheus   — metrics scraper     http://localhost:9090
#   • Grafana      — dashboards          http://localhost:3002
#   • Alertmanager — alert routing       http://localhost:9093
services:

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    # Lets the aegis-backend scrape job reach a backend running locally via
    # `venv` (host.docker.internal:8000, see prometheus.yml) in addition to
    # the containerized `backend:8000` from docker-compose.yml — Linux
    # doesn't resolve host.docker.internal without this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # No default on purpose: a default password IS the vulnerability. Compose
      # aborts with this message if either is unset.
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env (see header)}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (see header)}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aegis.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Host 3001 was already in use by another process on this machine —
      # remapped to 3002. Change back to 3001:3000 if that frees up.
      - "3002:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
