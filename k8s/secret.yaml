# !! NEVER commit real values to git !!
# Create this secret manually:
#
#   kubectl create secret generic aegis-secrets -n aegis \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://user:pass@host/aegis" \
#     --from-literal=GROQ_API_KEY="gsk_..." \
#     --from-literal=NVIDIA_API_KEY="nvapi-..." \
#     --from-literal=INDIANAPI_KEY="sk-live-..." \
#     --from-literal=REDIS_URL="redis://aegis-redis:6379"
#
# Or use a secrets manager (Vault, AWS Secrets Manager, GCP Secret Manager).
# The template below is for reference only — values are placeholders.

apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  DATABASE_URL:      "postgresql+asyncpg://aegis:CHANGE_ME@aegis-postgres:5432/aegis"
  GROQ_API_KEY:      "CHANGE_ME"
  NVIDIA_API_KEY:    "CHANGE_ME"
  INDIANAPI_KEY:     "CHANGE_ME"
  OPENROUTER_API_KEY: ""
  GEMINI_API_KEY:     ""

  # ── REQUIRED — the pod will NOT start without this ────────────────────────
  # main.py's lifespan raises at startup with APP_ENV=production and no
  # JWT_SECRET_KEY, so applying these manifests without setting it produces a
  # CrashLoopBackOff, not a degraded service. It was missing from this template
  # entirely. Generate with: openssl rand -hex 32
  JWT_SECRET_KEY:     "CHANGE_ME"

  # ── Fail-closed gates: unset means 403, not "open" ────────────────────────
  # Sent as the X-Admin-Key header. Gates GET /health/status, GET /metrics and
  # DELETE /api/cache in production. Deliberately NOT the same value as
  # JWT_SECRET_KEY — that secret signs every user's session, so reusing it here
  # would turn a header leak into a full auth bypass.
  # Generate with: openssl rand -hex 32
  ADMIN_API_KEY:      "CHANGE_ME"

  # Fernet key encrypting each user's TOTP secret at rest. /2fa/setup returns
  # 501 until this is set. Rotating it invalidates stored TOTP secrets and
  # forces every 2FA user to re-enrol, so set it once and keep it.
  # Generate with:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  TOTP_ENCRYPTION_KEY: "CHANGE_ME"

  # ── Optional ──────────────────────────────────────────────────────────────
  RESEND_API_KEY:     ""        # password-reset email; logs the link if unset
  SENTRY_DSN:         ""        # error tracking; disabled if unset
  GOOGLE_CLIENT_ID:   ""        # Sign in with Google; button hidden if unset
